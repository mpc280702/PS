name: Source checks

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JavaScript syntax
        run: |
          node --check index.js
          node --check bootstrap.js
          node --check preview.js
      - name: Validate Python syntax
        run: python -m py_compile server.py
      - name: Validate manifest and UI contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "2.6.0", manifest.get("version")
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "btnAnalyzeBanner", "bannerSegQuality", "btnSelectMainMasks", "btnSelectAllMasks",
              "btnSelectNoMasks", "btnImportMasks", "autoSegObjectList", "chkAutoCreateOverlay", "chkAutoHideOriginal",
              "btnLoadSegImage", "segPointMode", "segPreviewImage",
              "segOverlayCanvas", "btnClearPoints", "btnAddObject",
              "btnProcess", "btnCheck", "statusText", "detailText",
          ]
          missing = [item for item in required if f'id="{item}"' not in html]
          assert not missing, f"Missing UI elements: {missing}"
          server = Path("server.py").read_text(encoding="utf-8")
          for route in ("/sam_health", "/segment_init", "/segment_point", "/segment_export", "/segment_close", "/segment_auto", "/segment_auto_export", "/segment_auto_close"):
              assert f'"{route}"' in server, f"Missing route {route}"
          assert "_diversify_banner_candidates" in server, "Missing size/spatial balancing"
          assert 'crop_n_layers=config["crop_layers"]' in server, "Missing crop-based fine-detail scanning"
          assert '"crop_x": crop_x' in server and '"crop_y": crop_y' in server, "Missing crop placement metadata"
          js = Path("index.js").read_text(encoding="utf-8")
          assert "importedLayer.translate" in js, "Missing cropped-layer placement"
          assert "x: response.crop_x" in js and "y: response.crop_y" in js, "Auto layer import does not restore canvas offsets"
          assert '"__remainder__"' in server, "Missing complementary layer export"
          assert "Import Preservation Overlay" in js, "Missing preservation overlay import path"
          assert "createPreservationOverlay" in js, "Missing overlay-by-default contract"
          assert "_group_nearby_banner_parts" in server, "Missing coherent component grouping"
          print("Manifest, grouped banner components, remainder layer, cropped placement and API contracts passed.")
          PY
